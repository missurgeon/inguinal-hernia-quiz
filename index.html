<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로봇 서혜부탈장수술 환자 교육 퀴즈 (28문항)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 900px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            background: #4ade80;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 14px;
            margin-top: 8px;
            opacity: 0.9;
        }

        .quiz-content {
            flex: 1;
            overflow-y: auto;
            padding: 25px 20px;
        }

        .question-container {
            display: none;
        }

        .question-container.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            font-size: 16px;
            color: #374151;
        }

        .option:hover {
            border-color: #667eea;
            background: #f3f4f6;
        }

        .option input[type="radio"] {
            margin-right: 12px;
            cursor: pointer;
            width: 20px;
            height: 20px;
        }

        .option.selected {
            border-color: #667eea;
            background: #eef2ff;
        }

        .option.correct {
            border-color: #4ade80;
            background: #dcfce7;
        }

        .option.incorrect {
            border-color: #ef4444;
            background: #fee2e2;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #dcfce7;
            border-left: 4px solid #4ade80;
            color: #166534;
        }

        .feedback.incorrect {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
        }

        .feedback-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .results-container {
            display: none;
            text-align: center;
            padding: 30px 20px;
        }

        .results-container.show {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            font-weight: 700;
            margin: 20px auto;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .score-text {
            font-size: 24px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 20px;
        }

        .result-details {
            font-size: 16px;
            color: #6b7280;
            margin: 15px 0;
            line-height: 1.8;
        }

        .footer {
            padding: 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            max-width: 200px;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            flex: 1;
            max-width: 200px;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .share-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        .share-btn {
            padding: 10px 15px;
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .share-btn:hover {
            background: #f3f4f6;
        }

        .qr-code {
            margin-top: 20px;
            text-align: center;
        }

        .qr-code img {
            max-width: 200px;
            border-radius: 8px;
        }

        .start-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .start-screen.show {
            display: flex;
        }

        .start-screen h2 {
            font-size: 28px;
            color: #1f2937;
            margin-bottom: 15px;
        }

        .start-screen p {
            font-size: 16px;
            color: #6b7280;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .info-box {
            background: #f0f9ff;
            border-left: 4px solid #0284c7;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            margin: 20px 0;
            font-size: 14px;
            color: #1e40af;
        }

        .result-save {
            margin-top: 24px;
            padding: 18px 16px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            text-align: left;
            width: 100%;
            max-width: 420px;
        }

        .result-save-title {
            font-size: 16px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 6px;
        }

        .result-save-desc {
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .save-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .save-input {
            flex: 1;
            padding: 11px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            color: #1f2937;
            outline: none;
            min-width: 0;
        }

        .save-input:focus {
            border-color: #667eea;
        }

        .save-input-sm {
            max-width: 90px;
        }

        .save-btn {
            width: 100%;
            max-width: 100%;
            margin-bottom: 6px;
        }

        .save-status {
            font-size: 13px;
            margin: 6px 0;
            color: #1e40af;
        }

        .save-status.success {
            color: #166534;
            font-weight: 600;
        }

        .save-status.error {
            color: #991b1b;
        }

        .privacy-note {
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.5;
            margin-top: 8px;
        }

        @media (max-height: 600px) {
            .container {
                max-height: 100vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>로봇 서혜부탈장수술 환자 교육 퀴즈</h1>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0 / 28</div>
        </div>

        <div class="quiz-content">
            <div class="start-screen show" id="startScreen">
                <h2>수술 전 이해도 확인하기</h2>
                <p>서혜부탈장과 로봇 수술에 대해<br>얼마나 알고 계신가요?</p>
                <div class="info-box">
                    <strong>📋 퀴즈 정보</strong><br>
                    • 총 28문항 객관식<br>
                    • 소요 시간: 약 15-20분<br>
                    • 즉시 정답과 해설 제공<br>
                    • 모바일에 최적화
                </div>
            </div>

            <div id="quizContainer"></div>

            <div class="results-container" id="resultsContainer">
                <h2>퀴즈 완료!</h2>
                <div class="score-circle" id="scoreCircle">0</div>
                <div class="score-text">점수: <span id="finalScore">0</span> / 28</div>
                <div class="result-details" id="resultDetails"></div>
                <div class="result-save">
                    <div class="result-save-title">⚡️ 의료진에게 결과 전달</div>
                    <p class="result-save-desc">이름을 입력하시면 점수와 오답 내역이 담당 의료진에게 전달되어, 수술 설명 때 도와드릴 수 있습니다.</p>
                    <div class="save-row">
                        <input type="text" id="patientName" class="save-input" placeholder="이름 (예: 홍길동)" autocomplete="name">
                        <input type="number" id="patientAge" class="save-input save-input-sm" placeholder="나이" min="1" max="120" inputmode="numeric">
                    </div>
                    <button class="btn btn-primary save-btn" id="saveBtn" onclick="submitResult()">결과 저장 후 전송</button>
                    <div class="save-status" id="saveStatus"></div>
                    <p class="privacy-note">※ 입력하신 이름·나이는 수술 전 교육 확인 목적으로만 사용되며, 담당 의료진만 열람합니다.</p>
                </div>

                <div class="qr-code">
                    <p style="font-size: 12px; color: #9ca3af; margin-bottom: 10px;">이 퀴즈 공유하기</p>
                    <img id="qrCode" src="" alt="QR Code">
                </div>
            </div>
        </div>

        <div class="footer" id="footer">
            <button class="btn btn-secondary" id="prevBtn" onclick="previousQuestion()">이전</button>
            <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">다음</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "서혜부 탈장 수술 후 재발을 막고 상처 회복을 돕기 위해, 수술 전 최소 얼마 동안 금연해야 할까요?",
                options: [
                    "4주에서 8주",
                    "2주에서 3주",
                    "1주에서 2주",
                    "10주에서 12주"
                ],
                correct: 0,
                feedback: "흡연은 상처 치유에 필요한 콜라겐 합성을 방해하고 만성 기침으로 복압을 높입니다. 수술 전 최소 4주에서 8주간의 금연을 권장합니다.",
                wrongFeedback: "1주에서 2주 또는 2주에서 3주는 담배로 인한 혈류 장애와 기도 자극이 회복되기에 너무 짧습니다. 10주에서 12주는 권장 최소 기간을 크게 넘는 기간으로, 그만큼 기다려야 수술이 가능한 것은 아닙니다."
            },
            {
                question: "수술 전 복벽의 긴장을 줄이고 좋은 결과를 얻기 위해 권장되는 체중 감량 정도는 어느 정도일까요?",
                options: [
                    "1%에서 2%",
                    "5%에서 10%",
                    "15%에서 20%",
                    "25%에서 30%"
                ],
                correct: 1,
                feedback: "수술 전 체중의 5%에서 10% 정도를 줄이면 복압이 낮아지고 수술 시야가 좋아져 회복에 도움이 됩니다.",
                wrongFeedback: "1%에서 2%는 복압을 의미 있게 낮추기에 부족합니다. 15%에서 20%, 25%에서 30%는 단기간에 시도할 경우 영양 불균형과 근육 손실을 일으켜 오히려 회복을 방해할 수 있습니다."
            },
            {
                question: "수술 당일 안전한 전신마취를 위해 병원에 오기 전 지켜야 할 최소 금식 시간은 얼마일까요?",
                options: [
                    "1시간에서 2시간",
                    "3시간에서 4시간",
                    "6시간에서 8시간",
                    "12시간에서 24시간"
                ],
                correct: 2,
                feedback: "마취 중 위 내용물이 폐로 넘어가는 흡인을 막기 위해 수술 전 최소 6시간에서 8시간 동안 음식과 음료를 금합니다. 구체적인 시간은 담당 의료진의 안내를 따르세요.",
                wrongFeedback: "1시간에서 2시간, 3시간에서 4시간은 위에 음식물이 남아 흡인성 폐렴 위험이 있습니다. 12시간에서 24시간의 과도한 금식은 탈수와 체력 저하를 일으켜 오히려 회복에 불리합니다."
            },
            {
                question: "수술을 받으러 가기 전, 집에서 편하게 회복할 수 있도록 미리 준비해 두면 좋은 것은 무엇일까요?",
                options: [
                    "복부를 압박할 단단한 모래주머니",
                    "마취를 없애준다는 방 소독용 특수 약품",
                    "회복 운동용 실내 자전거와 무거운 아령",
                    "복부를 받쳐줄 여분의 베개, 가까이 둘 물, 헐렁하고 편한 옷"
                ],
                correct: 3,
                feedback: "기침할 때 배를 받쳐줄 베개, 수분 보충을 위한 물, 사타구니를 조이지 않는 헐렁한 옷을 준비해 두면 퇴원 후 훨씬 편합니다.",
                wrongFeedback: "모래주머니로 수술 부위를 누르는 것은 불필요하고 해로울 수 있습니다. 실내 자전거와 아령은 복압을 높여 재발 위험을 키웁니다. 마취를 없애는 방 소독제 같은 것은 존재하지 않습니다."
            },
            {
                question: "수술 당일 마취에서 깨어나 귀가할 때, 보호자가 반드시 지켜야 할 안전 수칙은 무엇일까요?",
                options: [
                    "마취 성분이 남아 있으므로 환자는 절대 직접 운전하지 않고, 보호자가 운전해 귀가시킨다",
                    "환자가 통증을 견디며 직접 운전해 집으로 가도록 격려한다",
                    "혈액순환을 위해 귀가하자마자 함께 조깅을 시작한다",
                    "기침을 가라앉히도록 차가운 음료를 곧바로 마시게 한다"
                ],
                correct: 0,
                feedback: "마취 회복기에는 판단력과 반사 신경이 떨어져 있습니다. 수술 후 최소 24시간은 직접 운전을 삼가고, 반드시 보호자가 동행해 귀가하셔야 합니다.",
                wrongFeedback: "환자가 직접 운전하는 것은 사고 위험이 매우 큰 금기 사항입니다. 수술 당일 조깅은 복압을 급격히 올려 재발을 부릅니다. 차가운 탄산음료를 갑자기 많이 마시면 위장 자극과 기침을 유발할 수 있습니다."
            },
            {
                question: "수술 후 통증을 줄이기 위해 마취과 전문의가 복벽의 감각 신경만 선택적으로 차단하는 방법을 무엇이라고 할까요?",
                options: [
                    "전신 근육 이완 요법",
                    "복횡근막면 차단술(TAP 블록)",
                    "꼬리뼈 신경 집중 소독",
                    "척추 관통 고정법"
                ],
                correct: 1,
                feedback: "복횡근막면 차단술(TAP 블록)은 복벽 감각 신경 주위에 국소마취제를 투여해 수술 후 통증을 줄이는 방법으로, 마약성 진통제 사용량을 낮추는 데 도움이 됩니다.",
                wrongFeedback: "전신 근육 이완은 마취 중 근육을 늘어뜨리는 것으로 통증 차단 기술이 아닙니다. 꼬리뼈 소독은 통증 조절과 무관한 처치입니다. 척추를 관통해 고정하는 수술법은 존재하지 않습니다."
            },
            {
                question: "일반적인 난이도의 로봇 서혜부 탈장 수술에서, 수술 자체에 걸리는 평균 시간은 어느 정도일까요?",
                options: [
                    "10분에서 20분",
                    "3시간에서 4시간",
                    "45분에서 90분",
                    "5시간에서 6시간"
                ],
                correct: 2,
                feedback: "환자 상태와 복잡한 정도에 따라 다르지만, 순수 수술 시간은 평균 45분에서 90분 정도입니다. 마취 준비와 회복 시간이 더해지므로 전체 소요 시간은 이보다 깁니다.",
                wrongFeedback: "10분에서 20분은 복막 박리, 메쉬 배치, 봉합을 하기에 턱없이 부족합니다. 3시간 이상은 고난도 종양 수술 등에 해당하는 시간입니다."
            },
            {
                question: "수술 당일, 장 마비 같은 합병증을 줄이고 빠르게 회복하기 위해 가장 중요한 행동은 무엇일까요?",
                options: [
                    "체력 보충을 위해 누운 채로 든든하고 딱딱한 식사부터 한다",
                    "상처가 자극받지 않도록 움직이지 않고 누워만 있는다",
                    "복근 감각을 깨우기 위해 누운 채 다리를 들어 올린다",
                    "의료진의 도움을 받아 수술 후 1시간에서 2시간 이내에 가볍게 걷기 시작한다"

                ],
                correct: 0,
                feedback: "베개로 상처를 받쳐 통증을 줄인 뒤 깊은 심호흡을 반복하면 마취 중 쪼그라들었던 폐포가 펴지고 가래 배출에도 도움이 됩니다.",
                wrongFeedback: "숨을 오래 참거나 얕고 빠르게 호흡하면 폐포가 더 쭈그러듭니다. 상처를 받치지 않고 세게 기침하면 수술 부위에 무리가 갑니다."
            },
            {
                question: "수술이 진행되는 동안 보호자가 해야 할 일은 무엇일까요?",
                options: [
                    "환자가 수술실에 들어가면 안심하고 멀리 외출한다",
                    "지정된 대기 공간에서 진행 상황 안내를 확인하며, 긴급 연락이나 수술 결과 설명 시 즉시 응할 수 있도록 대기한다",
                    "수술실 문을 열고 들어가 수술 장면을 직접 확인한다",
                    "쾌유를 빌며 수술실 앞 복도에서 큰 소리로 통화한다"
                ],
                correct: 1,
                feedback: "수술 중 예기치 못한 상황이 생기거나 수술 직후 결과를 설명할 때 즉시 연락이 닿아야 하므로, 보호자는 지정된 장소에서 연락 가능한 상태로 대기해 주셔야 합니다.",
                wrongFeedback: "연락이 닿지 않으면 긴급 결정이 지연됩니다. 수술실 진입은 멸균 환경을 훼손하는 행위이며, 대기 구역에서의 소란은 다른 환자와 의료진에게 방해가 됩니다."
            },
            {
                question: "퇴원 시 처방받은 진통제와 소염제는 어떻게 복용해야 할까요?",
                options: [
                    "아프지 않으면 남은 약을 즉시 모두 버린다",

                    "통증이 심하지 않더라도 정해진 일정에 맞춰 꾸준히 복용해 통증이 심해지는 것을 예방한다",
                    "시중에서 파는 진통제를 처방약과 함께 여러 개 겹쳐 먹는다"
                ],
                correct: 2,
                feedback: "통증이 심해진 뒤 약을 먹는 것보다, 정해진 간격으로 꾸준히 복용해 통증을 미리 눌러주는 편이 회복과 조기 보행에 훨씬 유리합니다.",
                wrongFeedback: "임의로 중단하거나 용량을 줄이면 조절하기 어려운 통증이 올 수 있습니다. 시중 진통제를 상의 없이 겹쳐 먹으면 성분이 중복되어 간과 위에 부담을 줍니다."
            },
            {
                question: "입원 생활을 편하게 하기 위해 환자가 미리 챙겨오면 좋은 준비물은 무엇일까요?",
                options: [
                    "침상에서 요리할 수 있는 가스레인지와 냄비",
                    "금반지와 목걸이 등 값비싼 장신구",
                    "여가용으로 볼 무겁고 두꺼운 책 수십 권",
                    "배를 조이지 않는 헐렁한 고무줄 바지, 신고 벗기 편한 슬리퍼, 개인 세면도구"
                ],
                correct: 3,
                feedback: "사타구니를 압박하지 않는 헐렁한 바지, 복도 보행 시 신고 벗기 편한 슬리퍼, 개인 세면도구를 챙겨오시면 입원 생활이 한결 편합니다.",
                wrongFeedback: "귀중품은 분실 위험이 있어 병원 반입을 권하지 않습니다. 무거운 책은 들어 올릴 때 복압을 높입니다. 조리기구는 병실 안전 규정상 반입할 수 없습니다."
            }
        ];

        let currentQuestion = -1;
        let score = 0;
        let answers = new Array(quizData.length).fill(null);

        // ===== 결과 수집 설정 =====
        // ★ 아래 endpoint를 Apps Script 웹앱 URL로 교체하면 환자 점수가 스프레드시트로 전송됩니다.
        const CONFIG = {
            endpoint: "https://script.google.com/macros/s/AKfycbz-_1ZlNyVKDZ2OBfuS6eyZZ8qinIYQ_zl-C3Y8z_7mLeaS7EPoUdai0DHfRCfvfxbzDg/exec"
        };
        const QUIZ_STORAGE_KEY = 'herniaQuizPending';
        let quizStartTime = Date.now();

        function endpointReady() {
                        return CONFIG.endpoint && CONFIG.endpoint.indexOf('REPLACE_ME') === -1;
        }

        function saveToLocalQueue(payload) {
            const q = JSON.parse(localStorage.getItem(QUIZ_STORAGE_KEY) || '[]');
            q.push(payload);
            localStorage.setItem(QUIZ_STORAGE_KEY, JSON.stringify(q));
        }

        function removeFromQueue(payload) {
            const q = JSON.parse(localStorage.getItem(QUIZ_STORAGE_KEY) || '[]');
            localStorage.setItem(QUIZ_STORAGE_KEY, JSON.stringify(q.filter(x => x.uid !== payload.uid)));
        }

        function flushQueue() {
            if (!endpointReady()) return;
            const q = JSON.parse(localStorage.getItem(QUIZ_STORAGE_KEY) || '[]');
            if (!q.length) return;
            fetch(CONFIG.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(q[0]), mode: 'cors' })
                .then(r => r.json())
                .then(d => { if (d && d.ok) { removeFromQueue(q[0]); flushQueue(); } })
                .catch(() => {});
        }

        function submitResult() {
            const name = document.getElementById('patientName').value.trim();
            const age = document.getElementById('patientAge').value.trim();
            const status = document.getElementById('saveStatus');
            const btn = document.getElementById('saveBtn');
            if (!name) {
                status.textContent = '이름을 입력해주세요.';
                status.className = 'save-status error';
                return;
            }
            if (!window._quizResult) {
                status.textContent = '점수를 확인할 수 없습니다. 다시 풀어주세요.';
                status.className = 'save-status error';
                return;
            }
            const r = window._quizResult;
            const payload = {
                uid: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
                name: name,
                age: age || '',
                score: r.score,
                total: r.total,
                percent: r.percent,
                durationSec: r.durationSec,
                wrongNums: r.wrongNums.join(','),
                userAgent: navigator.userAgent.slice(0, 150)
            };
            if (!endpointReady()) {
                status.textContent = '서버 설정이 준비 중입니다. 잠시 후 다시 시도해주세요.';
                status.className = 'save-status error';
                return;
            }
            btn.disabled = true;
            status.textContent = '전송 중…';
            status.className = 'save-status';
            saveToLocalQueue(payload);
            fetch(CONFIG.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), mode: 'cors' })
                .then(res => res.json())
                .then(data => {
                    if (data && data.ok) {
                        removeFromQueue(payload);
                        status.textContent = '✓ 저장 완료! 담당 의료진이 확인합니다.';
                        status.className = 'save-status success';
                        btn.textContent = '전송 완료';
                    } else {
                        btn.disabled = false;
                        status.textContent = '전송에 실패했습니다. 다시 시도해주세요.';
                        status.className = 'save-status error';
                    }
                })
                .catch(() => {
                    btn.disabled = false;
                    const q = JSON.parse(localStorage.getItem(QUIZ_STORAGE_KEY) || '[]');
                    status.textContent = '네트워크 문제로 전송되지 못했습니다. (기기에 ' + q.length + '건이 임시 저장됨 — 다음 퀴즈 접속 시 자동 재전송)';
                    status.className = 'save-status error';
                });
        }


        function initQuiz() {
            renderQuestions();
            updateProgress();
            flushQueue();
        }

        function renderQuestions() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            quizData.forEach((q, index) => {
                const div = document.createElement('div');
                div.className = `question-container ${index === currentQuestion ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="question-text">${index + 1}. ${q.question}</div>
                    <div class="options">
                        ${q.options.map((option, optIndex) => `
                            <label class="option">
                                <input type="radio" name="option" value="${optIndex}" 
                                    ${answers[index] === optIndex ? 'checked' : ''}
                                    onchange="selectOption(${index}, ${optIndex})">
                                ${String.fromCharCode(65 + optIndex)}) ${option}
                            </label>
                        `).join('')}
                    </div>
                    <div class="feedback ${answers[index] !== null ? 'show' : ''}" id="feedback-${index}">
                        <div class="feedback-title" id="feedback-title-${index}"></div>
                        <div id="feedback-text-${index}"></div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function selectOption(questionIndex, optionIndex) {
            answers[questionIndex] = optionIndex;
            const q = quizData[questionIndex];
            const feedbackDiv = document.getElementById(`feedback-${questionIndex}`);
            const titleDiv = document.getElementById(`feedback-title-${questionIndex}`);
            const textDiv = document.getElementById(`feedback-text-${questionIndex}`);
            const options = document.querySelectorAll(`[name="option"]`);

            // 정답 여부 판단
            const isCorrect = optionIndex === q.correct;

            // 선택지 스타일 업데이트
            options.forEach((opt, idx) => {
                const optLabel = opt.parentElement;
                if (idx === optionIndex) {
                    optLabel.classList.add(isCorrect ? 'correct' : 'incorrect');
                }
            });

            // 피드백 표시
            feedbackDiv.classList.add('show');
            feedbackDiv.classList.add(isCorrect ? 'correct' : 'incorrect');
            titleDiv.textContent = isCorrect ? '✅ 정답!' : '❌ 틀렸습니다';
            textDiv.innerHTML = isCorrect ? q.feedback : q.wrongFeedback;

            // 점수 재계산 (정답 배열 기준 — 답을 바꿔도 정확)
            score = quizData.reduce((s, q, i) => s + (answers[i] === q.correct ? 1 : 0), 0);

            updateProgress();
        }

        function nextQuestion() {
            if (currentQuestion === -1) {
                currentQuestion = 0;
            } else if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
            } else {
                showResults();
                return;
            }

            renderQuestions();
            updateProgress();
            document.querySelector('.quiz-content').scrollTop = 0;
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestions();
                updateProgress();
                document.querySelector('.quiz-content').scrollTop = 0;
            }
        }

        function updateProgress() {
            const answered = answers.filter(a => a !== null).length;
            const total = quizData.length;

            document.getElementById('progressText').textContent = `${answered} / ${total}`;
            document.getElementById('progressFill').style.width = `${(answered / total) * 100}%`;

            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (currentQuestion === -1) {
                prevBtn.style.display = 'none';
                nextBtn.textContent = '시작하기';
                document.getElementById('startScreen').classList.add('show');
            } else {
                document.getElementById('startScreen').classList.remove('show');
                prevBtn.style.display = 'block';
                prevBtn.disabled = currentQuestion === 0;
                nextBtn.textContent = currentQuestion === quizData.length - 1 ? '제출' : '다음';
            }
        }

        function showResults() {
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('resultsContainer').classList.add('show');
            document.getElementById('footer').style.display = 'none';

            const percentage = Math.round((score / quizData.length) * 100);
            document.getElementById('scoreCircle').textContent = score;
            document.getElementById('finalScore').textContent = score;
            window._quizResult = {
                score: score,
                total: quizData.length,
                percent: percentage,
                wrongNums: quizData.map((q, i) => answers[i] === q.correct ? null : i + 1).filter(v => v !== null),
                durationSec: Math.round((Date.now() - quizStartTime) / 1000)
            };

            let resultText = '';
            if (percentage >= 90) {
                resultText = '🌟 훌륭합니다! 수술에 대해 매우 잘 이해하고 계십니다.';
            } else if (percentage >= 70) {
                resultText = '👍 좋습니다! 기본 내용은 잘 이해하셨습니다.';
            } else if (percentage >= 50) {
                resultText = '📚 보충 학습이 필요합니다. 의료팀과 상담해주세요.';
            } else {
                resultText = '💡 수술 전에 의료팀과 자세히 상담하시기를 권장합니다.';
            }

            document.getElementById('resultDetails').innerHTML = `
                <p>${resultText}</p>
                <p style="margin-top: 15px; font-size: 14px;">정답률: ${percentage}%</p>
            `;

            // QR 코드 생성
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(window.location.href)}`;
            document.getElementById('qrCode').src = qrUrl;
        }

        function shareResult() {
            const text = `로봇 서혜부탈장수술 환자 교육 퀴즈 완료! 
점수: ${score}/28 (${Math.round((score/28)*100)}%)
함께 수술 전 이해도를 높여보세요!`;

            if (navigator.share) {
                navigator.share({ title: '퀴즈 결과', text: text });
            } else {
                alert(text + '\n\n링크: ' + window.location.href);
            }
        }

        function downloadResult() {
            const content = `로봇 서혜부탈장수술 환자 교육 퀴즈 결과

점수: ${score} / ${quizData.length}
정답률: ${Math.round((score/quizData.length)*100)}%

문항별 결과:
${quizData.map((q, i) => `${i+1}. ${answers[i] === q.correct ? '✅ 정답' : '❌ 오답'}`).join('\n')}

날짜: ${new Date().toLocaleString('ko-KR')}`;

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `서혜부탈장_퀴즈결과_${new Date().toISOString().split('T')[0]}.txt`;
            link.click();
        }

        // 초기화
        initQuiz();
    </script>
